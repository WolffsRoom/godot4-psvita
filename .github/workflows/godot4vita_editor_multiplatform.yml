name: Godot4Vita editor distributions

on:
  # Runs when this workflow changes on the v0.3 test branch (test); workflow_dispatch
  # only works once the file is on the default branch.
  push:
    branches: [test]
    paths: ['.github/workflows/godot4vita_editor_multiplatform.yml']
  workflow_dispatch:
    inputs:
      support_release:
        description: Release tag containing the Windows editor ZIP used as the portable Vita support payload
        required: true
        default: v0.2

permissions:
  contents: read

jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            host: linux
            arch: x86_64
            build: platform/vita/tools/build_linux_editor.sh
            payload: _build/editor-linux/Godot4Vita
            artifact: Godot4Vita-v0.3-Linux-x86_64.zip
          - runner: macos-15
            host: macos
            arch: universal
            build: platform/vita/tools/build_macos_editor.sh
            payload: _build/editor-macos/Godot4Vita.app
            artifact: Godot4Vita-v0.3-macOS-universal.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools (Linux)
        if: matrix.host == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev
          python -m pip install scons

      - name: Install build tools (macOS)
        if: matrix.host == 'macos'
        run: python -m pip install scons

      - name: Download portable Vita support payload
        env:
          GH_TOKEN: ${{ github.token }}
          SUPPORT_TAG: ${{ inputs.support_release || 'v0.2' }}
        shell: bash
        run: |
          mkdir -p _build/support-download _build/support
          gh release download "$SUPPORT_TAG" --pattern '*Windows-x64.zip' --dir _build/support-download
          python - <<'PY'
          import pathlib, zipfile
          source = next(pathlib.Path('_build/support-download').glob('*.zip'))
          with zipfile.ZipFile(source) as archive:
              archive.extractall('_build/support-unpacked')
          roots = [p for p in pathlib.Path('_build/support-unpacked').iterdir() if p.is_dir()]
          if len(roots) != 1:
              raise SystemExit(f'Expected one support root, got {roots}')
          import shutil
          shutil.copytree(roots[0], '_build/support', dirs_exist_ok=True)
          PY
          test -f _build/support/vita/templates/vita_release.zip
          # Same portable rewrite as package_windows_editor.py: the addon
          # scripts use res://addons/psvita paths, the integrated editor
          # resolves its support files beside the executable.
          python - <<'PY'
          import pathlib, re
          source = pathlib.Path('platform/vita/editor/addons/psvita')
          target = pathlib.Path('_build/support/vita')
          for name in ('platform.gd', 'defaults_inspector.gd', 'trophy_tools.gd', 'trophy_panel.gd'):
              text = (source / name).read_text(encoding='utf-8')
              text = text.replace('const TEMPLATE =', 'static var TEMPLATE =')
              text = text.replace('const DEFAULT_DIR =', 'static var DEFAULT_DIR =')
              text = re.sub(r'"res://addons/psvita/([^"\n]*)"',
                            lambda m: 'OS.get_executable_path().get_base_dir().path_join("vita/' + m[1] + '")', text)
              if name == 'defaults_inspector.gd':
                  text = text.replace('Preenche Release, Icon, Background e Startup com o template e as imagens padrão incluídas.',
                                      'Restaura os padrões incluídos no editor. Campos vazios usam esses arquivos automaticamente.')
                  text = text.replace('preset.set("custom_template/release", VitaPlatform.TEMPLATE)', 'preset.set("custom_template/release", "")')
                  text = text.replace('preset.set(key, VitaPlatform.default_asset_path(key))', 'preset.set(key, "")')
              assert 'res://addons/psvita' not in text, name
              (target / name).write_text(text, encoding='utf-8')
          PY

      - name: Check the bundled Vita runtime
        id: runtime
        shell: bash
        # The support ZIP brings vita/templates/vita_release.zip. Only a v0.3
        # runtime (PCK prefetch) matches the v0.3 export scripts copied above;
        # an older one still packages, but the artifact is marked not for release.
        run: |
          python - <<'PY'
          import json, os, zipfile
          with zipfile.ZipFile('_build/support/vita/templates/vita_release.zip') as template:
              lib = template.read('libgodot.so')
              manifest = json.loads(template.read('vita-template.json')) if 'vita-template.json' in template.namelist() else {}
          v03 = b'GODOT_VITA_PCK_PREFETCH' in lib
          print('template manifest:', json.dumps({k: manifest.get(k) for k in ('backend', 'runtime_shacc', 'texture_formats', 'source_vpk_sha256')}))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('suffix=' + ('' if v03 else '-old-vita-runtime-do-not-release') + '\n')
          if not v03:
              print('::warning::The support release bundles a pre-v0.3 Vita runtime; run with support_release set to a release whose Windows ZIP carries the v0.3 template.')
          PY

      - name: Build editor
        shell: bash
        # The scripts default to ../_build outside the checkout; write inside it
        # so the packaging step finds the payload.
        run: ${{ matrix.build }} "$GITHUB_WORKSPACE/$(dirname '${{ matrix.payload }}')"

      - name: Package distribution
        shell: bash
        run: |
          python platform/vita/tools/package_editor_distribution.py \
            --platform '${{ matrix.host }}' --arch '${{ matrix.arch }}' \
            --payload '${{ matrix.payload }}' --support _build/support \
            --output 'releases/${{ matrix.artifact }}'

      - name: Packaging tests
        run: python platform/vita/tools/tests/test_package_editor_distribution.py

      - name: Linux Vita export smoke test
        if: matrix.host == 'linux'
        shell: bash
        run: |
          cp -a _build/support/vita _build/editor-linux/vita
          _build/editor-linux/Godot4Vita --headless --version
          _build/editor-linux/Godot4Vita --headless --path _build/support/Exemplo \
            --export-release 'PS Vita' "$RUNNER_TEMP/LinuxValidation.vpk"
          python - <<'PY'
          import os, pathlib, zipfile
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(temp / 'LinuxValidation.vpk') as archive:
              assert archive.testzip() is None
              required = {'eboot.bin', 'libgodot.so', 'sce_sys/param.sfo', 'game_data_folder.cfg'}
              assert required <= set(archive.namelist())
          # v0.3 separate-folder layout: <folder>/game.pck (+ logs/ on the Vita).
          pck = temp / 'exemplovita' / 'game.pck'
          assert pck.read_bytes()[:4] == b'GDPC'
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Godot4Vita-${{ matrix.host }}-${{ matrix.arch }}${{ steps.runtime.outputs.suffix }}
          path: |
            releases/${{ matrix.artifact }}
            releases/${{ matrix.artifact }}.sha256
